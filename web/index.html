<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WIA Vaatz</title>
    <link rel="stylesheet" href="/styles.css?v=20260730-1310" />
  </head>
  <body>
    <main class="app">
      <aside class="panel">
        <h1>WIA Vaatz</h1>
        <div class="actions single">
          <button id="wiaDirect">WIA Vaatz 직접 이동</button>
          <button id="approvalListUploadButton" type="button">품의서 리스트 업로드</button>
          <input id="approvalListFileInput" type="file" accept=".csv,.xlsx,.xls" hidden />
          <div id="sidebarApprovalList" class="sidebar-approval-list" hidden>
            <div class="sidebar-list-header">
              <span>품의서 리스트</span>
              <strong id="sidebarApprovalTotal">0</strong>
            </div>
            <div id="sidebarApprovalRows" class="sidebar-list-rows"></div>
          </div>
          <button id="clickApprovalNumber">품의번호 누르기</button>
          <button id="dumpOpenPages">열린 창 저장</button>
          <button id="dumpPage">화면 분석 저장</button>
        </div>
        <dl class="status">
          <dt>URL</dt>
          <dd id="url">-</dd>
          <dt>상태</dt>
          <dd id="state">대기</dd>
        </dl>
      </aside>
      <section class="viewport">
        <img id="screen" alt="WIA Vaatz browser screen" draggable="false" />
      </section>
    </main>
    <div id="vaatzLoginModal" class="modal" hidden>
      <form id="vaatzLoginForm" class="modal-dialog">
        <h2>Vaatz 로그인</h2>
        <label>
          <span>ID</span>
          <input id="vaatzIdInput" class="side-input" type="text" autocomplete="username" />
        </label>
        <label>
          <span>PASSWORD</span>
          <input id="vaatzPasswordInput" class="side-input" type="password" autocomplete="current-password" />
        </label>
        <div class="modal-actions">
          <button id="vaatzLoginCancel" type="button">취소</button>
          <button type="submit">확인</button>
        </div>
      </form>
    </div>
    <div id="approvalListModal" class="modal" hidden>
      <div class="modal-dialog approval-list-dialog">
        <div class="modal-header">
          <h2>품의서 리스트</h2>
          <button id="approvalListClose" type="button" class="icon-button" aria-label="닫기">×</button>
        </div>
        <div class="approval-summary">
          <span>총 건수</span>
          <strong id="approvalListTotal">0</strong>
        </div>
        <div id="approvalListFileName" class="file-name"></div>
        <div class="approval-list-table-wrap">
          <table class="approval-list-table">
            <thead>
              <tr>
                <th>품의번호</th>
                <th>발주일</th>
              </tr>
            </thead>
            <tbody id="approvalListRows"></tbody>
          </table>
        </div>
        <div class="modal-actions approval-list-actions">
          <button id="approvalListCancel" type="button">취소</button>
          <button id="approvalListConfirm" type="button">확인</button>
        </div>
      </div>
    </div>
    <script src="/app.js?v=20260730-1310"></script>
  </body>
</html>
